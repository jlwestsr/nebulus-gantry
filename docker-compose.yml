services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/gantry.db
      - NEBULUS_CHROMA_URL=http://chromadb:8000
      - NEBULUS_LLM_URL=${NEBULUS_LLM_URL:-http://tabby:5000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:3001}
      - SECRET_KEY=dev-secret-change-in-production
      - PYTHONPATH=/app:/atom:/core
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
      - ../nebulus-core/src:/core:ro
      - ../nebulus-atom:/atom:ro
      - ${HOME}/.atom:/root/.atom:ro
    networks:
      - default
      - nebulus
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000

networks:
  nebulus:
    external: true
    name: ${NEBULUS_NETWORK:-nebulus-prime_ai-network}
